name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --locked

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Compile Python source and DAG
        run: uv run python -m compileall -q src scripts tests dags
